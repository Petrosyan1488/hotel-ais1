<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АИС Гостиница — Панель управления</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>🏨 АИС «Гостиница» — Управление номерами</h1>
            <div id="auth-block">
                <button id="google-login-btn" class="btn google-btn">Войти через Google</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="form-section" id="admin-panel">
            <h2>Добавить новый номер (Доступно администраторам)</h2>
            <form id="room-form">
                <input type="text" id="room_number" placeholder="Номер комнаты (например, 101)" required>
                <select id="room_type" required>
                    <option value="" disabled selected>Выберите тип</option>
                    <option value="Стандарт">Стандарт</option>
                    <option value="Люкс">Люкс</option>
                    <option value="Апартаменты">Апартаменты</option>
                </select>
                <input type="number" id="room_price" placeholder="Цена за сутки (₸)" required>
                <select id="room_status" required>
                    <option value="Свободен">Свободен</option>
                    <option value="Занят">Занят</option>
                    <option value="На уборке">На уборке</option>
                </select>
                <input type="text" id="room_desc" placeholder="Описание (удобства)">
                <button type="submit" class="btn">Добавить номер</button>
            </form>
        </section>

        <section class="filter-section">
            <h2>Поиск и фильтрация</h2>
            <div class="filters">
                <input type="text" id="search-input" placeholder="Поиск по номеру комнаты...">
                <select id="filter-status">
                    <option value="all">Все статусы</option>
                    <option value="Свободен">Свободен</option>
                    <option value="Занят">Занят</option>
                    <option value="На уборке">На уборке</option>
                </select>
            </div>
        </section>

        <section class="list-section">
            <h2>Список номеров отеля</h2>
            <div id="rooms-grid" class="rooms-grid">
                <p class="loading">Связываемся с Supabase...</p>
            </div>
        </section>
    </main>
    <section id="admin-panel" style="display: none; margin-top: 30px; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h2 style="margin-top: 0; color: #1e293b; margin-bottom: 20px;">Добавить новый номер</h2>
        
        <form id="room-form" style="display: flex; flex-direction: column; gap: 15px;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Номер комнаты:</label>
                    <input type="text" id="room-number" placeholder="Например: 404" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Тип номера:</label>
                    <select id="room-type" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                        <option value="Стандарт">Стандарт</option>
                        <option value="Люкс">Люкс</option>
                        <option value="Апартаменты">Апартаменты</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Цена (₸ / сутки):</label>
                    <input type="number" id="room-price" placeholder="Цена за сутки" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">Статус:</label>
                    <select id="room-status" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                        <option value="Свободен">Свободен</option>
                        <option value="Занят">Занят</option>
                        <option value="На уборке">На уборке</option>
                    </select>
                </div>
            </div>
            
            <div>
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Описание:</label>
                <textarea id="room-description" placeholder="Описание удобств номера..." rows="3" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit;"></textarea>
            </div>
            
            <button type="submit" style="background: #3b82f6; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; align-self: flex-start;">
                Сохранить номер в базу
            </button>
        </form>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
